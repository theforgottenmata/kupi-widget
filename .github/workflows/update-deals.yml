name: Aktualizace akcí

on:
  # 06:00, 11:00 a 17:00 UTC = 8:00, 13:00 a 19:00 Praha v létě (o hodinu dřív
  # v zimě, DST záměrně neřešíme). Data se mění jednou denně — tři běhy jsou
  # tu proto, že MacBook bývá zavřený a jeden pokus se běžně nepovede.
  # Když je Mac vypnutý, job počká ve frontě a GitHub ho po čase zruší;
  # od toho jsou ty další dva pokusy.
  schedule:
    - cron: '0 6,11,17 * * *'
  # Ruční spuštění při vývoji a ladění.
  workflow_dispatch:

# POZOR: repozitář je veřejný a job běží na self-hosted runneru, tedy
# na skutečném Macu. Proto tu ZÁMĚRNĚ není trigger `pull_request` —
# bez něj nemůže cizí fork spustit kód na tvém stroji.
# Nový trigger sem nepřidávej, dokud si nerozmyslíš, kdo ho může vyvolat.

# Bez tohohle skončí commit z Action na 403.
permissions:
  contents: write

concurrency:
  group: update-deals
  cancel-in-progress: false

jobs:
  update:
    # Kupi je za Cloudflare a na datacentrové IP (GitHub hosted runnery běží
    # na Azure) pouští managed challenge -> HTTP 403 na všechno.
    # Z domácí IP projde běžný request bez problémů, proto self-hosted runner.
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Runner na Macu už dvakrát spadl na "lost communication with the server" —
      # stroj usnul uprostřed jobu. caffeinate ho drží vzhůru 15 minut a pak
      # se sám ukončí. Na zavřené víko bez externího monitoru to nestačí,
      # tam pomůže jen probuzení (pmset).
      - name: Nenechat Mac usnout během běhu
        run: nohup caffeinate -dimsu -t 900 >/dev/null 2>&1 &

      - run: npm ci

      - name: Testy parseru
        run: npm test

      - name: Stáhnout akce a vygenerovat deals.json
        env:
          KUPI_SAVE_HTML: '1'
        run: npm run generate

      # Nahrát i při selhání — jinak nemáme HTML právě v tu chvíli,
      # kdy ho potřebujeme nejvíc.
      - name: Uložit stažené HTML pro ladění
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kupi-html
          path: .debug/
          retention-days: 7
          if-no-files-found: ignore

      # Commitujeme i při pouhé změně updatedAt: drží to repozitář aktivní,
      # takže GitHub nevypne cron po 60 dnech nečinnosti.
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deals.json
          git diff --staged --quiet || git commit -m "deals: $(date -u +%Y-%m-%d)"
          git push
